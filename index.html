<!DOCTYPE html>
<html>
<head>
    <title>Aryan Bajpai - AI Profile</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(-45deg, #00f2fe, #4facfe, #7367f0, #00c9ff);
            background-size: 400% 400%;
            animation: gradientBG 10s ease infinite;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .profile-card {
            backdrop-filter: blur(20px);
            background: rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            padding: 35px;
            width: 350px;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.3);
            animation: float 4s ease-in-out infinite;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
            100% { transform: translateY(0px); }
        }

        img {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            border: 4px solid white;
            box-shadow: 0 0 25px #00f2fe;
            transition: 0.4s;
        }

        img:hover {
            transform: scale(1.08);
            box-shadow: 0 0 40px #7367f0;
        }

        h2 {
            margin-top: 20px;
            font-size: 26px;
            background: linear-gradient(to right, #fff, #00f2fe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .role {
            font-size: 15px;
            margin: 8px 0;
            color: #fff;
            opacity: 0.9;
        }

        .email {
            font-size: 14px;
            color: #f1f1f1;
            margin-bottom: 20px;
        }

        .btn {
            padding: 12px 22px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: bold;
            color: white;
            background: linear-gradient(45deg, #00f2fe, #7367f0);
            transition: 0.4s;
            box-shadow: 0 0 20px rgba(0,0,0,0.2);
        }

        .btn:hover {
            transform: scale(1.1);
            box-shadow: 0 0 30px #00f2fe;
        }

        .ai-tag {
            margin-top: 15px;
            font-size: 12px;
            color: #fff;
            opacity: 0.7;
            letter-spacing: 2px;
        }

    </style>
</head>
<body>

    <div class="profile-card">
        <img src="aryan.jpg" alt="Aryan Bajpai">
        <h2>Aryan Bajpai</h2>
        <p class="role">Second Year B.Tech Student</p>
        <p class="role">Aspiring Web Developer 🚀</p>
        <p class="email">📧 bajpaiarayn@gmail.com</p>
        <a href="mailto:bajpaiarayn@gmail.com" class="btn">Let's Connect</a>
       
    </div>

</body>
</html>
